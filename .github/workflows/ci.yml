name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch: a later push makes an in-flight run
# irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks and the DSP test suite. Fast, and the most likely thing to fail,
  # so it runs as its own job to give quick feedback.
  checks:
    name: Lint, types and DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Validates the DSP against analytically known signals: weighting frequency
      # response, time weighting, energy averaging, band allocation, percentiles.
      # A DSP regression fails the build here.
      - name: DSP unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Proves DSP_VALIDATION.md is still reproducible from the current code. The
      # output is deliberately not diffed against the committed copy: it carries a
      # generation timestamp and machine-dependent timing figures, so it can never be
      # byte-identical across machines. What matters is that it regenerates cleanly.
      - name: Regenerate the DSP validation report
        run: npm run report:dsp

      - name: Check the report contains measurements
        run: |
          grep -q 'Worst A deviation inside the fit range' DSP_VALIDATION.md
          grep -q 'worst centre-frequency gain error' DSP_VALIDATION.md
          grep -q 'unstable designs' DSP_VALIDATION.md
          echo "DSP validation report regenerated successfully."

  # End-to-end tests against a real production build, driving the whole measurement
  # chain with Chrome's fake audio capture device.
  e2e:
    name: End-to-end (Chromium, fake audio device)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `pretest:e2e` builds first, so the tests never run against a stale build.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
